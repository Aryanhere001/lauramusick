name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Source Code
        run: |
          unzip -q -o app-source.zip -d .

      - name: Auto-Patch Manifest and Resources
        run: |
          # 1. Missing XML files create karo
          mkdir -p app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="root" path="."/></cloud-backup><device-transfer><include domain="root" path="."/></device-transfer></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content><include domain="file" path="."/></full-backup-content>' > app/src/main/res/xml/backup_rules.xml

          # 2. Agar Manifest me rules abhi bhi tang karein toh attributes safe karo
          if [ -f app/src/main/AndroidManifest.xml ]; then
            sed -i 's/android:dataExtractionRules="@xml\/data_extraction_rules"//g' app/src/main/AndroidManifest.xml
            sed -i 's/android:fullBackupContent="@xml\/backup_rules"//g' app/src/main/AndroidManifest.xml
          fi

          # 3. Suppress compileSdk 35 warning
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info || ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
