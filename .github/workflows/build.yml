name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Extract Source Code
        run: |
          unzip -q -o app-source.zip -d .

      - name: Fix Missing XML Resources
        run: |
          # Dhoondho jahan app module ka res folder hai
          RES_DIR=$(find . -type d -path "*/src/main/res" | head -n 1)
          if [ -n "$RES_DIR" ]; then
            mkdir -p "$RES_DIR/xml"
            
            # Missing data_extraction_rules.xml create karo
            cat << 'EOF' > "$RES_DIR/xml/data_extraction_rules.xml"
<?xml version="1.0" encoding="utf-8"?>
<data-extraction-rules>
    <cloud-backup>
        <include domain="root" path="."/>
    </cloud-backup>
    <device-transfer>
        <include domain="root" path="."/>
    </device-transfer>
</data-extraction-rules>
EOF

            # Missing backup_rules.xml create karo
            cat << 'EOF' > "$RES_DIR/xml/backup_rules.xml"
<?xml version="1.0" encoding="utf-8"?>
<full-backup-content>
    <include domain="file" path="."/>
</full-backup-content>
EOF

            echo "Fixed missing XML rules in: $RES_DIR/xml"
          fi

      - name: Build Debug APK
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
