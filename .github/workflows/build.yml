name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Create Missing Android Resources
        run: |
          RES_DIR="app/src/main/res"
          mkdir -p "$RES_DIR/values" "$RES_DIR/xml" "$RES_DIR/drawable" "$RES_DIR/mipmap-anydpi-v26"

          # 1. Missing app_name string
          cat << 'EOF' > "$RES_DIR/values/strings.xml"
          <resources>
              <string name="app_name">AuraMusic</string>
          </resources>
          EOF

          # 2. Missing Theme
          cat << 'EOF' > "$RES_DIR/values/themes.xml"
          <resources>
              <style name="Theme.AuraMusic" parent="android:Theme.Material.Light.NoActionBar" />
          </resources>
          EOF

          # 3. Missing XML rules
          cat << 'EOF' > "$RES_DIR/xml/data_extraction_rules.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup><include domain="root" path="."/></cloud-backup>
              <device-transfer><include domain="root" path="."/></device-transfer>
          </data-extraction-rules>
          EOF

          cat << 'EOF' > "$RES_DIR/xml/backup_rules.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <include domain="file" path="."/>
          </full-backup-content>
          EOF

          # 4. Dummy launcher icon
          cat << 'EOF' > "$RES_DIR/drawable/ic_launcher_background.xml"
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#3DDC84" android:pathData="M0,0h108v108h-108z"/>
          </vector>
          EOF

          cat << 'EOF' > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_background" />
          </adaptive-icon>
          EOF

          cp "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" "$RES_DIR/mipmap-anydpi-v26/ic_launcher_round.xml"

          # Suppress SDK 35 warning
          echo "android.suppressUnsupportedCompileSdk=35" >> gradle.properties

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
