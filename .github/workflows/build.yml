name: Extract Project to Repo

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  unpack-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract zip and cleanup
        run: |
          unzip -q -o app-source.zip -d .
          rm app-source.zip

          # Missing XML rules inject karo
          mkdir -p app/src/main/res/xml
          echo '<?xml version="1.0" encoding="utf-8"?><data-extraction-rules><cloud-backup><include domain="root" path="."/></cloud-backup><device-transfer><include domain="root" path="."/></device-transfer></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml
          echo '<?xml version="1.0" encoding="utf-8"?><full-backup-content><include domain="file" path="."/></full-backup-content>' > app/src/main/res/xml/backup_rules.xml

          # Proper Gradle 8.7 wrapper generate karo (Gradle 9 AGP crash karta hai)
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew

          # Git me commit karke push karo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-extracted Android source and configured wrapper" || echo "No changes"
          git push
